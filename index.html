<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta http-equiv="refresh" content="300">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel Logística Guajajaras</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: cabeçalho com logo, abas por área, depois KPIs -> gráficos -> tabela detalhada em cada aba */
:root{
  --bg:#f4f3f2; --surface:#ffffff; --surface2:#faf9f8; --fg:#1d1a1a; --muted:#6d6666; --line:#e3dfde;
  --brand:#d3202a; --brand-ink:#ffffff; --brand-soft:#fbe6e7;
  --good:#1b8a5a; --warn:#c77a00; --bad:#cc1f2d; --good-soft:#e1f3ea; --bad-soft:#fbe4e5; --warn-soft:#fbefd9;
  --bar-hi:#1e9a64; --bar-lo:#d3202a; --heat:211,32,42; --logo-bg:#ffffff;
  --f-display:'Barlow Semi Condensed','Arial Narrow',Arial,sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#161213; --surface:#211b1c; --surface2:#1b1617; --fg:#f2eeee; --muted:#a79c9d; --line:#352c2d;
  --brand:#ef4a53; --brand-ink:#1a0d0e; --brand-soft:#3a1a1d;
  --good:#3ecf8e; --warn:#f0a93b; --bad:#ff6b74; --good-soft:#15382b; --bad-soft:#40181c; --warn-soft:#3b2b10;
  --bar-hi:#2fb67a; --bar-lo:#e5424c; --heat:239,74,83; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161213; --surface:#211b1c; --surface2:#1b1617; --fg:#f2eeee; --muted:#a79c9d; --line:#352c2d;
  --brand:#ef4a53; --brand-ink:#1a0d0e; --brand-soft:#3a1a1d;
  --good:#3ecf8e; --warn:#f0a93b; --bad:#ff6b74; --good-soft:#15382b; --bad-soft:#40181c; --warn-soft:#3b2b10;
  --bar-hi:#2fb67a; --bar-lo:#e5424c; --heat:239,74,83; color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45;
  padding:0 max(16px,env(safe-area-inset-left,0px)) 32px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:1280px;margin:0 auto}
.num{font-variant-numeric:tabular-nums}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;padding:16px 0 14px}
.id{display:flex;align-items:center;gap:16px;min-width:0}
.logo{background:var(--logo-bg);border-radius:8px;padding:6px 10px;display:flex;flex:none}
.logo img{height:46px;width:auto;display:block}
header h1{font-family:var(--f-display);font-weight:700;font-size:clamp(22px,3.6vw,32px);line-height:1.05;margin:0;text-wrap:balance;text-transform:uppercase;letter-spacing:.01em}
header .sub{font-size:13px;color:var(--muted);margin-top:2px}
header .stamp{font-size:12px;color:var(--muted);text-align:right;display:grid;gap:4px;justify-items:end}
header .stamp b{color:var(--fg);font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip{font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;background:var(--good-soft);color:var(--good)}
.chip.off{background:var(--bad-soft);color:var(--bad)}

nav.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);overflow-x:auto;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav.tabs button{font:600 15px var(--f-display);letter-spacing:.04em;text-transform:uppercase;background:none;border:0;color:var(--muted);
  padding:12px 16px;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-2px}
nav.tabs button:hover{color:var(--fg)}
nav.tabs button[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand)}
nav.tabs button:focus-visible,.seg button:focus-visible,input:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

section.pane{padding-top:18px;display:grid;gap:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px;min-width:0}
.kpi .l{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1.15;margin-top:2px}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.hl{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.kpi.hl .l,.kpi.hl .s{color:inherit;opacity:.85}

.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:860px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px;min-width:0}
.card h2{font-family:var(--f-display);font-size:15px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin:0 0 10px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
.card h2 small{font:500 12px var(--f-body);letter-spacing:0;text-transform:none;color:var(--muted)}
.scroll{overflow-x:auto}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:6px;padding:28px 20px;color:var(--muted);text-align:center}
.empty b{color:var(--fg)}
[hidden]{display:none!important}
.sup{display:inline-flex;align-items:baseline;gap:8px;justify-self:start;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:6px;padding:6px 14px}
.sup span{font:600 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sup b{font:700 18px var(--f-display);letter-spacing:.02em}
.diaf{display:grid;gap:3px}
.diaf .dl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.diaf .drow{display:flex;align-items:center;gap:8px;height:36px}
.diaf input[type=number]{width:52px;font:500 14px var(--f-body);background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:7px 6px;text-align:center}
.diaf button{font:600 12px var(--f-body);background:var(--surface);color:var(--brand);border:1px solid var(--line);border-radius:6px;padding:7px 10px;cursor:pointer}
.dtrack{position:relative;width:170px;height:22px}
.dtrack::before{content:'';position:absolute;left:0;right:0;top:50%;height:4px;margin-top:-2px;background:var(--line);border-radius:2px}
.dtrack .dfill{position:absolute;top:50%;height:4px;margin-top:-2px;background:var(--brand);border-radius:2px}
.dtrack input[type=range]{position:absolute;left:0;top:0;width:100%;height:22px;margin:0;padding:0;background:none;pointer-events:none;-webkit-appearance:none;appearance:none}
.dtrack input[type=range]::-webkit-slider-runnable-track{background:transparent;height:22px}
.dtrack input[type=range]::-moz-range-track{background:transparent}
.dtrack input[type=range]::-webkit-slider-thumb{pointer-events:auto;-webkit-appearance:none;appearance:none;width:16px;height:16px;margin-top:3px;border-radius:50%;background:var(--brand);border:2px solid var(--surface);box-shadow:0 0 0 1px var(--brand);cursor:pointer}
.dtrack input[type=range]::-moz-range-thumb{pointer-events:auto;width:12px;height:12px;border-radius:50%;background:var(--brand);border:2px solid var(--surface);cursor:pointer}
.dtrack input[type=range]:focus-visible::-webkit-slider-thumb{outline:2px solid var(--fg);outline-offset:2px}
.ms{position:relative}
.ms summary{list-style:none;cursor:pointer;font:600 12px var(--f-body);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 12px;white-space:nowrap;user-select:none}
.ms summary::-webkit-details-marker{display:none}
.ms summary::after{content:' ▾';color:var(--muted)}
.ms[open] summary,.ms summary:hover{border-color:var(--brand);color:var(--brand)}
.ms.on summary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.mspanel{position:absolute;right:0;z-index:30;margin-top:4px;width:min(320px,86vw);background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:10px;display:grid;gap:8px}
.mspanel input[type=search]{width:100%}
.msact{display:flex;gap:8px}
.msact button{font:600 12px var(--f-body);background:var(--surface2);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer}
.msact button:hover{border-color:var(--brand);color:var(--brand)}
.mslist{max-height:260px;overflow:auto;display:grid;gap:1px}
.mslist label{display:flex;gap:8px;align-items:center;padding:5px 6px;border-radius:4px;font-size:13px;cursor:pointer}
.mslist label:hover{background:var(--brand-soft)}
.mslist label[hidden]{display:none}
.areatag{display:inline-block;font:600 11px var(--f-body);letter-spacing:.04em;text-transform:uppercase;color:var(--brand);background:var(--brand-soft);border-radius:10px;padding:1px 8px}
.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;padding:0 0 12px}
.filters label{display:grid;gap:3px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.filters select{font:500 14px var(--f-body);background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-width:120px}
.filters select:focus-visible,.filters button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.filters button{font:600 13px var(--f-body);background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px 14px;cursor:pointer}
.filters button:hover{border-color:var(--brand);color:var(--brand)}
.filters .carga{font-size:12px;color:var(--muted);padding-bottom:9px}
.hbar.clk{cursor:pointer;border-radius:4px;padding:2px 4px;margin:2px -4px}
.hbar.clk:hover{background:var(--brand-soft)}
.hbar.sel{background:var(--brand-soft);box-shadow:inset 3px 0 0 var(--brand)}
.hbar.dim{opacity:.5}
.mclick:focus-visible{outline:none}
.mclick:focus-visible rect:nth-of-type(2){stroke:var(--brand);stroke-width:2}
tr.clk{cursor:pointer}
tr.clk.sel td{background:var(--brand-soft);box-shadow:inset 0 0 0 0 transparent}
tr.clk.sel td:first-child{box-shadow:inset 3px 0 0 var(--brand)}
.teamchip{display:inline-flex;gap:6px;align-items:center;font:600 12px var(--f-body);letter-spacing:0;text-transform:none;background:var(--brand);color:var(--brand-ink);border-radius:10px;padding:2px 4px 2px 10px}
.teamchip button{border:0;background:transparent;color:inherit;cursor:pointer;font-size:14px;line-height:1;padding:0 6px}

table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-family:var(--f-display);font-weight:600;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--surface2)}
th:first-child,td:first-child{text-align:left}
td.name{font-weight:600;white-space:normal;min-width:190px}
tr.total td{font-weight:700;border-top:2px solid var(--fg);background:var(--surface2)}
tbody tr:hover td{background:var(--brand-soft)}
tr.total:hover td{background:var(--surface2)}
th.grp{text-align:center;border-bottom:2px solid var(--brand);color:var(--fg)}
.up{color:var(--good)} .down{color:var(--bad)} .warn{color:var(--warn)}
.arrow{font-size:11px;margin-left:4px}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:600;background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{font:600 12px var(--f-body);background:var(--surface);color:var(--muted);border:0;padding:6px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
input[type=search]{font:14px var(--f-body);background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 10px;min-width:0;width:220px;max-width:100%}

.heat{width:100%}
.heat td,.heat th{text-align:center;padding:8px 4px}
.heat td:first-child,.heat th:first-child{text-align:left;padding-left:8px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.peak{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-top:12px}
.peak div{border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--surface2)}
.peak span{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.peak b{font-family:var(--f-display);font-size:22px}
svg text{font-family:var(--f-body);fill:var(--muted);font-size:11px}
svg .val{fill:var(--fg);font-weight:600}
.hbar{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:8px;align-items:center;margin:6px 0;font-size:13px}
.hbar .t{background:var(--line);border-radius:3px;height:14px;overflow:hidden}
.hbar .t i{display:block;height:100%;background:var(--brand)}
.note{font-size:12px;color:var(--muted);margin:0}
footer{margin-top:24px;font-size:12px;color:var(--muted)}
.ap{display:grid;gap:12px}
.apbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.apbar button{font:600 13px var(--f-body);background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px 14px;cursor:pointer}
.apbar button.prim{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.apbar span{font-size:12px;color:var(--muted)}
.aphost{display:flex;flex-direction:column;align-items:center;gap:16px;background:#6b6b6b;border-radius:8px;padding:14px 0}
.ap .page{zoom:var(--apz,.8);width:281mm;min-height:194mm;background:#fff;color:#1d1a1a;padding:7mm 8mm;display:flex;flex-direction:column;gap:6px;box-shadow:0 2px 14px rgba(0,0,0,.45);font:11px 'Segoe UI',Arial,sans-serif;line-height:1.3}
.ap .page *{box-sizing:border-box}
.ap .ph{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #1d1a1a;padding-bottom:5px}
.ap .ph img{height:34px}.ap .pt{text-align:center}.ap .pt b{display:block;font-size:17px}.ap .pt span{font-size:11px;color:#555}.ap .pd{font-size:10px;color:#555;text-align:right}
.ap .pf{margin-top:auto;display:flex;justify-content:space-between;font-size:9.5px;color:#666;border-top:.5px solid #bbb;padding-top:4px}
.ap .cols{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;flex:1;min-height:0}
.ap .col{border:.5px solid #bbb;border-radius:4px;padding:7px;display:flex;flex-direction:column;gap:5px;min-width:0}
.ap .sup2{display:flex;justify-content:space-between;align-items:baseline;border-bottom:.5px solid #ccc;padding-bottom:3px}.ap .sup2 b{font-size:15px}.ap .sup2 span{font-size:10px;color:#555}
.ap .say{margin:0;font-size:10.5px;line-height:1.35;background:#f7f6f4;border-left:3px solid #c4161c;padding:4px 7px;border-radius:0 4px 4px 0}
.ap .kp{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.ap .kp div{background:#f3f2f0;border-radius:4px;padding:3px 6px}.ap .kp small{display:block;font-size:9.5px;color:#555}.ap .kp strong{font-size:14px}
.ap .kp2{display:grid;grid-template-columns:1fr 1fr;gap:5px}.ap .kp2 div{background:#f3f2f0;border-radius:4px;padding:4px 8px}.ap .kp2 small{display:block;font-size:9.5px;color:#555}.ap .kp2 strong{font-size:16px}
.ap .dest{border:.5px solid #bbb;border-radius:4px;padding:5px 9px;background:#fffdf5}.ap .dest h3{margin:0 0 2px;font-size:11.5px}.ap .dest ul{margin:0;padding-left:15px}.ap .dest li{font-size:10.5px;line-height:1.35;margin:1px 0}
.ap .leg{font-size:10px;background:#f3f2f0;border-radius:4px;padding:4px 8px;color:#333}
.ap .page h3{margin:2px 0;font-size:12px;font-family:inherit;text-transform:none;letter-spacing:0}
.ap table{width:100%;border-collapse:collapse;font-size:10px}
.ap th{font:600 10px 'Segoe UI',Arial,sans-serif;letter-spacing:0;text-transform:none;color:#555;text-align:right;padding:2px 4px;border-bottom:1px solid #999;background:#f7f6f4;white-space:normal}
.ap td{text-align:right;padding:2px 4px;border-bottom:.5px solid #ddd;white-space:normal}
.ap th:first-child,.ap td:first-child,.ap td.l,.ap th.l{text-align:left}
.ap tbody tr:hover td,.ap tr:hover td{background:transparent}
.ap tr.tot td{font-weight:700;border-top:1.2px solid #222;background:#f3f2f0}
.ap .ok{color:#1b7a4e}.ap .bad{color:#b3141b}.ap .sg{color:#1b7a4e}.ap .sy{color:#9a6a00}.ap .sr{color:#b3141b}
.ap .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle}.ap .dot.g{background:#1b7a4e}.ap .dot.y{background:#d69e2e}.ap .dot.r{background:#c4161c}
.ap .pill{display:inline-block;padding:0 7px;border-radius:8px;font-size:9.5px;font-weight:600;white-space:nowrap}.ap .pill.g{background:#dff1e7;color:#1b7a4e}.ap .pill.y{background:#fbefd0;color:#8a5a00}.ap .pill.r{background:#fbdede;color:#b3141b}
.ap .nota{font-size:10px;color:#666;margin:1px 0}
.ap .cam{font-size:10px;color:#555;display:flex;gap:6px;align-items:center;margin:0}.ap .cam b{background:#1d1a1a;color:#fff;border-radius:9px;padding:0 8px;font-weight:600}.ap .cam i{font-style:normal;color:#999}
.ap .top2{display:grid;grid-template-columns:1fr 1.15fr;gap:10px}.ap .stack{display:flex;flex-direction:column;gap:5px;min-width:0}
.ap .blocks{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}.ap .bcol{display:flex;flex-direction:column;gap:7px;min-width:0}
.ap .lb{border:.5px solid #bbb;border-radius:4px;overflow:hidden}.ap .lh{display:flex;gap:6px;align-items:baseline;background:#1d1a1a;color:#fff;padding:3px 6px}.ap .lh b{font-size:11.5px}.ap .lh span{font-size:9px;opacity:.8}.ap .lh em{margin-left:auto;font-style:normal;font-size:9.5px}
.ap .bcol .lb table{table-layout:fixed}.ap .bcol .lb td,.ap .bcol .lb th{white-space:nowrap}.ap .bcol .lb th:first-child,.ap .bcol .lb td:first-child{width:31%}.ap .bcol .lb td:first-child{overflow:hidden;text-overflow:ellipsis}
.ap .gl{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}.ap .gl div{border-left:3px solid #c4161c;padding:2px 8px;font-size:10.5px;line-height:1.35}.ap .gl b{display:block;font-size:11.5px}.ap .gl i{color:#555;font-style:normal}
.ap .tree{display:flex;gap:6px;align-items:center;justify-content:center;font-size:12px;margin:2px 0}.ap .tree b{background:#1d1a1a;color:#fff;border-radius:6px;padding:4px 12px}.ap .tree span{color:#999}
.ap svg text{fill:#555;font-size:9px}.ap svg text.v{fill:#1d1a1a;font-weight:700}
.ap .empty{background:#fff;color:#555}
.apslide{position:fixed;inset:0;z-index:200;background:#17120f;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px}
.apslide[hidden]{display:none}
.apctl{display:flex;gap:12px;align-items:center;color:#fff;margin-bottom:10px;font-size:14px}
.apctl button{font:600 14px var(--f-body);background:#fff;color:#222;border:0;border-radius:6px;padding:6px 14px;cursor:pointer}
.apstage{width:min(96vw,calc((100vh - 80px) * 1.7778));aspect-ratio:16/9;background:#fff;color:#1d1a1a;border-radius:10px;overflow:hidden;font-size:calc(min(96vw,(100vh - 80px) * 1.7778) / 72);font-family:'Segoe UI',Arial,sans-serif}
.apsl{height:100%;padding:2.6% 3.4%;display:flex;flex-direction:column;gap:.9em;overflow:hidden}
.apsl .aph{display:flex;justify-content:space-between;align-items:center;border-bottom:.15em solid #1d1a1a;padding-bottom:.5em}
.apsl .aph small{display:block;font-size:.8em;color:#555}.apsl .aph h2{margin:0;font-size:2.4em;font-weight:700;font-family:inherit;text-transform:none;color:#1d1a1a}.apsl .aph b{font-size:1.2em;margin-right:.6em}

  }

function apEntInfo(E){

}

function apDest(l){return '<div class="dest"><h3>O que chama atenção</h3><ul>'+l.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul></div>'}
function apLeg(){return '<div class="leg"><b>Como ler as cores:</b> '+apDot('g')+'verde = na meta ou acima &nbsp; '+apDot('y')+'amarelo = até 10% abaixo da meta &nbsp; '+apDot('r')+'vermelho = mais de 10% abaixo &nbsp;·&nbsp; ▲ ▼ comparam com o mês anterior &nbsp;·&nbsp; Veja a última página para o significado de cada termo.</div>'}
function apSemDados(nome){return '<div class="empty" style="margin:20px 0"><b>Sem dados de '+nome+' para este período.</b><br>Abra o relatório correspondente no Power BI Desktop e atualize.</div>'}

function apPages(M){

     '<div>'+apPill(SI.sem,apTxt(SI.sem))+' &nbsp;Mês anterior '+ap1(st.pant)+' · <span class="'+apCls(st.var)+'">'+apSeta(st.var)+' '+n2(st.var)+'%</span></div>'+
     '<table><tr><th>Líder</th><th>Linhas</th><th>L/h</th><th>Meta</th><th>Situação</th></tr>'+SI.lid.map(function(l){var m=SI.mh[l[0]],c=apSem(l[3],m);return '<tr><td>'+esc(l[0])+'</td><td>'+n0(l[2])+'</td><td class="s'+c+'"><b>'+n1(l[3])+'</b></td><td>'+n1(m)+'</td><td>'+apDot(c)+'</td></tr>'}).join('')+'</table></div>';
  } else c1='<div class="col">'+apSemDados('Separação + Conferência')+'</div>';
  if(RI){var r0=RI.r0,tt=RI.tot;
    c2='<div class="col"><div class="sup2"><b>'+esc(SUPERVISAO.recebimento)+'</b><span>Recebimento + alocação</span></div><p class="say">'+RI.frase+'</p>'+
     '<div class="kp"><div><small>Volumes</small><strong>'+n0(tt[2])+'</strong></div><div><small>Vol./hora · meta '+META_REC+'</small><strong class="s'+RI.sem+'">'+n1(RI.prod)+'</strong></div><div><small>Meta do mês atingida</small><strong>'+ap1(tt[4])+'</strong></div></div>'+
     '<div>'+apPill(RI.sem,apTxt(RI.sem))+' &nbsp;Mês anterior '+(r0.ant?ap1(r0.ant):'—')+(r0.var==null?'':' · <span class="'+apCls(r0.var)+'">'+apSeta(r0.var)+' '+n2(r0.var)+'%</span>')+'</div>'+
     '<table><tr><th>Líder</th><th>Recbto</th><th>Aloc.</th><th>Situação</th></tr><tr><td>'+esc(M.R.leaderName||'Líder')+'</td><td>'+n0(tt[0])+'</td><td>'+n0(tt[1])+'</td><td>'+apDot(RI.sem)+'</td></tr></table>'+
     '<p class="nota">Meta fixa do mês: '+n0(r0.meta)+' volumes · '+n0(RI.horas)+' horas trabalhadas.</p></div>';
  } else c2='<div class="col">'+apSemDados('Recebimento')+'</div>';
  if(EI){var t=EI.t;
    c3='<div class="col"><div class="sup2"><b>'+esc(SUPERVISAO.entrega)+'</b><span>Entrega</span></div><p class="say">'+EI.frase+'</p>'+
     '<div class="kp"><div><small>Entregas</small><strong>'+n0(t[0])+'</strong></div><div><small>OTIF · meta '+ap1(EI.goal)+'</small><strong class="s'+EI.sem+'">'+ap1(t[11])+'</strong></div><div><small>Mês anterior</small><strong>'+(M.E.antLider==null?'—':ap1(M.E.antLider))+'</strong></div></div>'+
     '<div>'+apPill(EI.sem,EI.stt)+' &nbsp;'+(EI.vr==null?'':'<span class="'+apCls(EI.vr)+'">'+apSeta(EI.vr)+' '+apPp(EI.vr)+'</span> contra o mês anterior')+'</div>'+
     '<table><tr><th>Motorista</th><th>Entregas</th><th>OTIF</th></tr>'+EI.mot.slice(0,6).map(function(m){var c=m[12]>=EI.goal?'g':'y';return '<tr><td>'+esc(m[0])+'</td><td>'+n0(m[1])+'</td><td class="s'+c+'">'+apDot(c)+'<b>'+n2(m[12])+'%</b></td></tr>'}).join('')+'</table></div>';
  } else c3='<div class="col">'+apSemDados('Entrega')+'</div>';

  /* 2 e 3 - separação */
  if(SI){var S=M.S,st2=SI.st;
    var rows=SI.lid.map(function(l){var m=SI.mh[l[0]],c=apSem(l[3],m);return '<tr><td>'+esc(l[0])+'</td><td class="l">'+esc(SI.area(l[0]))+'</td><td>'+n0(l[1])+'</td><td>'+n0(l[2])+'</td><td class="s'+c+'"><b>'+n1(l[3])+'</b></td><td>'+n1(m)+'</td><td>'+apPill(c,apTxt(c))+'</td><td>'+n2(l[4])+'%</td><td>'+n0(l[5])+'</td><td>'+n2(l[6])+'%</td><td class="'+apCls(l[7])+'">'+apSeta(l[7])+' '+n2(l[7])+'%</td></tr>'}).join('');

     '<div class="top2"><div class="stack"><div class="kp2"><div><small>Linhas processadas</small><strong>'+n0(st2.total)+'</strong></div><div><small>Linhas por hora · meta '+n1(SI.meta)+'</small><strong class="s'+SI.sem+'">'+n1(st2.prod)+' '+apDot(SI.sem)+'</strong></div><div><small>Meta do mês atingida</small><strong>'+ap1(st2.pmeta)+'</strong></div><div><small>Mês anterior</small><strong>'+ap1(st2.pant)+'</strong></div></div>'+apDest(SI.dest)+'</div>'+
     '<div class="stack"><h3>Produtividade por dia <span class="nota">(linhas por hora · verde = na meta, amarelo = perto, vermelho = abaixo)</span></h3>'+apBars(S.daily,dmax,150,1,SI.meta)+'</div></div>'+

    var ks=chavesSet(),lj=[],ms=[],as=[];
    Object.keys(window.DADOS_SET).forEach(function(k){var s=window.DADOS_SET[k].sep;if(s&&s.lojas)s.lojas.forEach(function(l){if(l.n)LOJAS[l.k]=String(l.n).toLowerCase().replace(/(^|\s)(\S)/g,function(m,a,b){return a+b.toUpperCase()})})});
    ks.forEach(function(k){if(lj.indexOf(k.loja)<0)lj.push(k.loja);if(as.indexOf(k.ano)<0)as.push(k.ano)});
    ks.filter(function(k){return k.loja===FILTROS.loja&&k.ano===FILTROS.ano}).forEach(function(k){ms.push(k.mes)});
    if(!ms.length)ks.forEach(function(k){if(ms.indexOf(k.mes)<0)ms.push(k.mes)});
    lj.sort(function(a,b){return a-b});ms.sort(function(a,b){return a-b});as.sort();
    opts(fLoja,lj.map(function(k){return [k,k+' · '+nomeLoja(k)]}),FILTROS.loja);
    opts(fMes,ms.map(function(m){return [m,MESES[m].charAt(0).toUpperCase()+MESES[m].slice(1)]}),FILTROS.mes);
    opts(fAno,as.map(function(a){return [a,a]}),FILTROS.ano);
    return;
  }
  var ls=(lojasDados&&lojasDados.length)?lojasDados.map(function(l){LOJAS[l.k]=l.n?String(l.n).toLowerCase().replace(/(^|\s)(\S)/g,function(m,a,b){return a+b.toUpperCase()}):LOJAS[l.k];return [l.k,l.k+' · '+nomeLoja(l.k)]}):Object.keys(LOJAS).map(function(k){return [k,k+' · '+LOJAS[k]]});
  if(!ls.some(function(o){return String(o[0])===String(FILTROS.loja)}))ls.push([FILTROS.loja,String(FILTROS.loja)]);
  opts(fLoja,ls,FILTROS.loja);
  opts(fMes,MESES.slice(1).map(function(m,i){return [i+1,m.charAt(0).toUpperCase()+m.slice(1)]}),FILTROS.mes);
  var anos=[];for(var a=2025;a<=hoje.getFullYear()+1;a++)anos.push([a,a]);
  if(!anos.some(function(o){return o[0]===FILTROS.ano}))anos.push([FILTROS.ano,FILTROS.ano]);
  opts(fAno,anos,FILTROS.ano);
}
function aplicarFiltros(){
  FILTROS={loja:+fLoja.value,mes:+fMes.value,ano:+fAno.value};
  try{localStorage.setItem('filtrosPainel',JSON.stringify(FILTROS))}catch(e){}
  selLider=null;sepQ='';entMot='';recLider='';selOpsSep={};selOpsRec={};carregar(true);
}
[fLoja,fMes,fAno].forEach(function(s){s.addEventListener('change',aplicarFiltros)});
document.getElementById('fLider').addEventListener('change',function(e){setLider(e.target.value)});
document.getElementById('fLiderR').addEventListener('change',function(e){setRecFiltro(null,e.target.value)});
document.getElementById('fOper').addEventListener('change',function(e){setRecFiltro(e.target.value,null)});
document.getElementById('fAtual').addEventListener('click',function(){carregar(true)});
['rIni','rFim'].forEach(function(id){document.getElementById(id).addEventListener('input',function(){diaMudou(id)})});
['dIni','dFim'].forEach(function(id){document.getElementById(id).addEventListener('change',function(){diaMudou(id)})});
document.getElementById('dTodos').addEventListener('click',function(){DIAS.ini=1;DIAS.fim=DIAS.max;diaUI();diaMudou('')});
function hora(){return new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}
function redesenhar(){ajustaDias();DIA_SEM_FATOS=false;
  var y=window.scrollY;show(atual);window.scrollTo(0,y);
  montarFiltros(window.DADOS&&window.DADOS.sep?window.DADOS.sep.lojas:null);
}
function carregar(mostrarEspera){
  if(window.DADOS_SET){
    var d=window.DADOS_SET[FILTROS.loja+'-'+FILTROS.ano+'-'+FILTROS.mes];
    document.getElementById('fAtual').disabled=true;
    carga.textContent='Arquivo gerado em '+window.GERADO_EM+' · recarrega sozinho a cada 5 min';
    if(!d){var alt=chavesSet().filter(function(k){return k.loja===FILTROS.loja})[0]||chavesSet()[0];if(alt&&mostrarEspera){FILTROS={loja:alt.loja,ano:alt.ano,mes:alt.mes};d=window.DADOS_SET[alt.loja+'-'+alt.ano+'-'+alt.mes]}}
    if(!d)window.DADOS=null;else window.DADOS=d;
    redesenhar();return;
  }
  if(!servido){
    [fLoja,fMes,fAno,document.getElementById('fAtual')].forEach(function(e){e.disabled=true});
    carga.textContent='Modo arquivo: abra pelo iniciar.bat para usar os filtros.';
    var s=document.createElement('script');s.charset='utf-8';s.src='dados.js?t='+Date.now();
    s.onload=function(){if(window.DADOS&&window.DADOS.gerado!==gerado)redesenhar();s.remove()};
    s.onerror=function(){s.remove()};document.head.appendChild(s);return;
  }
  if(carregando)return;carregando=true;
  if(mostrarEspera){carga.textContent='Consultando o Power BI…';view.innerHTML='<div class="empty"><b>Carregando '+nomeLoja(FILTROS.loja)+' · '+MESES[FILTROS.mes]+'/'+FILTROS.ano+'…</b><br>A primeira consulta leva alguns segundos.</div>'}
  fetch('dados.json?loja='+FILTROS.loja+'&ano='+FILTROS.ano+'&mes='+FILTROS.mes,{cache:'no-store'})
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
    .then(function(d){
      var mudou=!window.DADOS||window.DADOS.gerado!==d.gerado||window.DADOS.params.loja!==d.params.loja||window.DADOS.params.mes!==d.params.mes||window.DADOS.params.ano!==d.params.ano;
      window.DADOS=d;carga.textContent='Atualizado às '+hora();
      if(mudou||mostrarEspera)redesenhar();
    })
    .catch(function(e){carga.textContent='Falha ao consultar: '+e.message+'. A janela preta do iniciar.bat está aberta?'})
    .then(function(){carregando=false});
}
montarFiltros(null);
show((location.hash||'').replace('#',''));
carregar(true);
setInterval(function(){carregar(false)},60000);
</script>
